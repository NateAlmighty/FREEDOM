<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout: Rainwater Revolution</title>
    <style>
        body { 
            font-family: monospace, Courier, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.5; 
            color: #111; 
            background-color: #fff;
        }
        h1 { 
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #ccc;
        }
        .item-name {
            font-weight: bold;
        }
        .item-price {
            font-weight: bold;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            font-size: 18px;
            font-weight: bold;
            border-top: 2px solid #000;
            margin-top: 10px;
        }
        .btn-buy {
            background: #000;
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #000;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-buy:hover { 
            background: #fff; 
            color: #000; 
        }
        .secure-note {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Confirm Your Order</h1>

    <div class="item-row">
        <span class="item-name">Rainwater Revolution (PDF)</span>
        <span class="item-price">$27.00</span>
    </div>

    <!-- Optional: Uncomment if you want to show the upsell as an add-on option here -->
    <!-- 
    <div class="item-row">
        <label style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="addUpsell"> Add Catchment Designer App (+$67)
        </label>
    </div> 
    -->

    <div class="total-row">
        <span>Total:</span>
        <span>$27.00</span>
    </div>

    <!-- Replace # with your ClickBank hoplink -->
    <a href="#" class="btn-buy">COMPLETE ORDER</a>

    <div class="secure-note">
        Secured by ClickBank SSL Encryption
    </div>

</body>
</html>
